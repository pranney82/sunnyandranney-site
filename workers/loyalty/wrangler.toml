[[d1_databases]]
binding = "DB"
database_name = "sunnyandranney-db"
database_id = "a3fbfba9-569c-4dae-af1a-4a1f290963f7"

[vars]
SHOPIFY_API_VERSION = "2026-04"
SHOPIFY_STORE_DOMAIN = "e89vsg-er.myshopify.com"
SHOPIFY_APP_CLIENT_ID = "93261a3e04788b6a2c4ed81e2454bc84"
# Secrets (set via `wrangler secret put`):
#   SHOPIFY_ADMIN_TOKEN          — Fallback Admin API token (current value: app automation token, doesn't actually work for Admin API; OAuth-captured token in loyalty_oauth_tokens D1 table takes precedence)
#   SHOPIFY_WEBHOOK_SECRET       — Loyalty app's client secret. Used for: (a) HMAC verify on webhook deliveries, (b) OAuth client_secret when exchanging install code for access token
