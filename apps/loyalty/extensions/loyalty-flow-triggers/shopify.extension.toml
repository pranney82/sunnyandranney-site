api_version = "2026-04"

# Custom Flow triggers fired by the loyalty Worker. Merchants build Shopify Flow
# workflows on top of these to send Shopify Email or SMS notifications via apps.

[[extensions]]
type = "flow_trigger"
handle = "loyalty-points-earned"
uid = "0f2b11a1-7945-16fc-2d89-bad24b314beba04d6b32"
name = "Loyalty: Points earned"
description = "Fires when a customer earns loyalty points from a paid order."

  [[extensions.settings.fields]]
  type = "customer_reference"

  [[extensions.settings.fields]]
  type = "order_reference"

  [[extensions.settings.fields]]
  type = "number_decimal"
  key = "pointsEarned"
  name = "Points earned"
  description = "Number of points earned on this order (post-multiplier)."

  [[extensions.settings.fields]]
  type = "number_decimal"
  key = "newBalance"
  name = "New balance"
  description = "Customer's available balance after this earn."

  [[extensions.settings.fields]]
  type = "single_line_text_field"
  key = "tierName"
  name = "Current tier"
  description = "Customer's tier at the time of the earn (Bronze, Silver, Gold)."

[[extensions]]
type = "flow_trigger"
handle = "loyalty-tier-upgraded"
uid = "e032a453-1f9f-869d-1dc3-6a5b25f33ff01093624c"
name = "Loyalty: Tier upgraded"
description = "Fires when a customer reaches a higher tier."

  [[extensions.settings.fields]]
  type = "customer_reference"

  [[extensions.settings.fields]]
  type = "single_line_text_field"
  key = "previousTier"
  name = "Previous tier"

  [[extensions.settings.fields]]
  type = "single_line_text_field"
  key = "newTier"
  name = "New tier"

  [[extensions.settings.fields]]
  type = "number_decimal"
  key = "lifetimeEarned"
  name = "Lifetime points"

[[extensions]]
type = "flow_trigger"
handle = "loyalty-points-redeemed"
uid = "e634b459-50ff-1cee-a7c9-6690d0216c2e4fb6b504"
name = "Loyalty: Points redeemed"
description = "Fires when a customer applies a loyalty redemption on a paid order."

  [[extensions.settings.fields]]
  type = "customer_reference"

  [[extensions.settings.fields]]
  type = "order_reference"

  [[extensions.settings.fields]]
  type = "number_decimal"
  key = "pointsRedeemed"
  name = "Points redeemed"

  [[extensions.settings.fields]]
  type = "single_line_text_field"
  key = "rewardType"
  name = "Reward type"
  description = "fixed_amount, percentage, free_product, or free_shipping"

  [[extensions.settings.fields]]
  type = "number_decimal"
  key = "newBalance"
  name = "New balance"
